<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eğitim Takip Asistanı v25.3</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Kütüphaneler -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Font (Getir Fontuna Benzer) -->
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">

    <script>
        window.DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/1e6anRqSJmDIBXwJAvyust3ROpNPtFMaTm92renU40HQ/edit?usp=sharing"; 
    </script>

    <style>
        :root {
            /* Taslak Renk Paleti */
            --purple:   #5D3EBC;
            --purple2:  #734696;
            --yellow:   #FFD10D;
            --slate:    #44546A;
            --gray:     #E7E6E6;
            --card:     #FFFFFF;
            --text:     #101827;
            --muted:    #6B7280;
            --r-outer:  28px;
            --r-card:   22px;
            --r-pill:   999px;
            --shadow:   0 18px 50px rgba(0,0,0,.22);
            --shadow-soft: 0 14px 30px rgba(0,0,0,.14);
            --line-dark: rgba(255,255,255,.16);
        }

        body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
        
        /* Uygulama Genel Stilleri */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        .font-getir { font-family: 'jihosoft', 'Varela Round', sans-serif; letter-spacing: -3px; font-weight: 800; }

        /* POSTER ÖZEL STİLLERİ (Capture Area) */
        .poster-output {
            color: #fff;
            padding: 28px 16px;
            background:
                radial-gradient(1200px 700px at 18% 10%, rgba(255,209,13,.18), transparent 58%),
                radial-gradient(900px 600px at 82% 18%, rgba(231,230,230,.12), transparent 55%),
                linear-gradient(180deg, var(--purple), var(--purple2));
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .poster-frame {
            border-radius: var(--r-outer);
            border: 1px solid var(--line-dark);
            background: rgba(255,255,255,.06);
            box-shadow: var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .poster-header {
            padding: 26px 28px 22px 28px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid var(--line-dark);
        }

        .poster-logo {
            width: 62px; height: 62px; border-radius: 999px;
            background: var(--yellow);
            display: grid; place-items: center;
            color: #3B1A8A; font-weight: 950; font-size: 14px;
            box-shadow: 0 12px 22px rgba(0,0,0,.18);
            flex: 0 0 auto;
        }

        .poster-kicker {
            display: flex; align-items: center; gap: 12px;
            font-weight: 800; font-size: 13px;
            color: rgba(255,255,255,.78);
            text-transform: uppercase; margin: 10px 0 8px 0;
        }

        .poster-kdot { width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.40); }

        .poster-title { margin: 0; font-weight: 950; font-size: 30px; line-height: 1.08; letter-spacing: .2px; }
        .poster-subtitle { margin: 10px 0 0 0; font-size: 16px; color: rgba(255,255,255,.82); line-height: 1.45; max-width: 720px; }

        .poster-date-pill {
            padding: 14px 18px; border-radius: var(--r-pill);
            border: 1px solid rgba(255,255,255,.22);
            background: rgba(255,255,255,.10);
            display: flex; align-items: center; gap: 12px;
            box-shadow: var(--shadow-soft); margin-top: 6px;
        }

        .poster-date-dot { width: 10px; height: 10px; border-radius: 999px; background: var(--yellow); box-shadow: 0 0 0 6px rgba(255,209,13,.16); }
        .poster-date-text { font-weight: 950; font-size: 20px; }

        .poster-main { padding: 22px 28px 26px 28px; display: grid; grid-template-columns: 1fr; gap: 18px; }

        .poster-card { background: var(--card); color: var(--text); border-radius: var(--r-card); box-shadow: var(--shadow-soft); border: 1px solid rgba(17,24,39,.06); overflow: hidden; }
        .poster-card-head { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(17,24,39,.10); }
        .poster-card-title { margin: 0; font-size: 18px; font-weight: 950; }
        .poster-tag { padding: 8px 12px; border-radius: var(--r-pill); background: rgba(255,209,13,.35); border: 1px solid rgba(255,209,13,.65); font-weight: 900; color: #2B1A67; }

        .poster-list { list-style: none; padding: 0; margin: 0; }
        .poster-list li { padding: 18px 20px; text-align: center; font-size: 22px; font-weight: 900; color: #111827; border-top: 1px solid #EEF0F3; }
        .poster-list li:first-child { border-top: 0; }

        .poster-info { padding: 18px 20px 20px 20px; }
        .poster-info h3 { margin: 0 0 10px 0; font-size: 18px; font-weight: 950; }
        .poster-info p { margin: 0 0 14px 0; color: #374151; font-size: 15px; line-height: 1.55; }
        .poster-pill-link { padding: 14px; border-radius: 16px; background: #F5F6FB; border: 1px solid #E6E7EE; font-weight: 950; color: #2B1A67; text-align: center; word-break: break-all; }

        .poster-footer { padding: 0 28px 28px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .poster-glass-box { border-radius: 22px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.10); padding: 18px 20px; }
        .poster-glass-box h4 { margin: 0 0 10px 0; font-size: 18px; font-weight: 950; }
        .poster-glass-box ul { margin: 0; padding-left: 18px; color: rgba(255,255,255,.88); line-height: 1.7; font-size: 15px; }
        .poster-glass-box code { background: rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.14); padding: 2px 8px; border-radius: 10px; font-weight: 950; }

        @media (max-width: 820px) {
            .poster-header { flex-direction: column; align-items: flex-start; }
            .poster-footer { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- İKON TANIMLARI ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const Upload = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></IconBase>;
        const FileUp = (props) => <IconBase {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="12" y2="12"/><line x1="15" y1="15" x2="12" y2="12"/></IconBase>;
        const FileText = (props) => <IconBase {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></IconBase>;
        const XCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></IconBase>;
        const Search = (props) => <IconBase {...props}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></IconBase>;
        const User = (props) => <IconBase {...props}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconBase>;
        const Filter = (props) => <IconBase {...props}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></IconBase>;
        const ChevronDown = (props) => <IconBase {...props}><polyline points="6 9 12 15 18 9"/></IconBase>;
        const ChevronUp = (props) => <IconBase {...props}><polyline points="18 15 12 9 6 15"/></IconBase>;
        const Loader = (props) => <IconBase {...props}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></IconBase>;
        const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></IconBase>;
        const MessageSquare = (props) => <IconBase {...props}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></IconBase>;
        const Check = (props) => <IconBase {...props}><polyline points="20 6 9 17 4 12"/></IconBase>;
        const Layers = (props) => <IconBase {...props}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></IconBase>;

        const App = () => {
            const [csvData, setCsvData] = useState([]);
            const [fileName, setFileName] = useState('');
            const [searchName, setSearchName] = useState('');
            const [managerList, setManagerList] = useState([]);
            const [activeTab, setActiveTab] = useState('orientation');
            const [expandedWarehouses, setExpandedWarehouses] = useState({});
            const [loading, setLoading] = useState(false);
            const [downloadingAll, setDownloadingAll] = useState(false);
            const [allHeaders, setAllHeaders] = useState([]);
            const [targetPhone, setTargetPhone] = useState('');
            const [isAutoLoaded, setIsAutoLoaded] = useState(false);
            
            const [chatSettings, setChatSettings] = useState({ id: '', name: '' });
            const [colMap, setColMap] = useState({ sy: '', sgs: '', warehouse: '', orientation: '', chat: '', name: '', phone: '' });
            const listRefs = useRef({});

            useEffect(() => {
                const savedPhone = localStorage.getItem('targetPhone');
                if (savedPhone) setTargetPhone(savedPhone);
                const savedChat = localStorage.getItem('chatSettings');
                if (savedChat) setChatSettings(JSON.parse(savedChat));
                
                fetch('id.txt')
                    .then(res => { if(res.ok) return res.text(); throw new Error('Dosya yok'); })
                    .then(text => { parseIdContent(text, true); })
                    .catch(err => console.log("Otomatik id.txt bulunamadı"));
            }, []);

            const saveTargetPhone = (e) => {
                const val = e.target.value;
                setTargetPhone(val);
                localStorage.setItem('targetPhone', val);
            };

            const parseIdContent = (text, isAuto = false) => {
                const lines = text.split('\n').map(l => l.trim()).filter(l => l);
                let foundId = '', foundName = '';
                lines.forEach(line => {
                    const lower = line.toLowerCase();
                    if (lower.startsWith('id:') || lower.startsWith('id=')) foundId = line.split(/[:=]/)[1].trim();
                    else if (lower.startsWith('isim:') || lower.startsWith('name:')) foundName = line.split(/[:=]/)[1].trim();
                });
                if (!foundId && !foundName && lines.length >= 2) { foundId = lines[0]; foundName = lines[1]; }
                
                if (foundId || foundName) {
                    const newSettings = { id: foundId, name: foundName };
                    setChatSettings(newSettings);
                    localStorage.setItem('chatSettings', JSON.stringify(newSettings));
                    if (isAuto) setIsAutoLoaded(true);
                    if (!isAuto) alert(`✅ Bilgiler Yüklendi!\nID: ${foundId}\nİsim: ${foundName}`);
                }
            };

            const handleIdFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => parseIdContent(event.target.result, false);
                reader.readAsText(file);
                e.target.value = null; 
            };

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                setFileName(file.name);
                setLoading(true);
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                        let sheetName = workbook.SheetNames.find(n => n.toLowerCase().includes('rapor')) || workbook.SheetNames[0];
                        const rawData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });
                        
                        const headers = rawData[0];
                        setAllHeaders(headers);
                        const find = (k) => headers.find(h => String(h).toLowerCase().includes(k)) || '';
                        const newColMap = {
                            sy: find('sy'), sgs: find('sgs'), warehouse: find('warehouse'),
                            name: find('courier name'), phone: find('courier gsm'),
                            orientation: find('oryantasyon'), chat: find('öğretici sohbetler')
                        };
                        setColMap(newColMap);

                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                        setCsvData(jsonData);

                        const managers = new Set();
                        jsonData.forEach(row => {
                           if(row[newColMap.sy]) managers.add(row[newColMap.sy]);
                           if(row[newColMap.sgs]) managers.add(row[newColMap.sgs]);
                        });
                        setManagerList(Array.from(managers).sort());
                        setLoading(false);
                    } catch (err) { alert("Dosya okunamadı."); setLoading(false); }
                };
                reader.readAsArrayBuffer(file);
            };

            const processedData = useMemo(() => {
                if (!csvData.length || !searchName) return null;
                const lowerSearch = searchName.toLocaleLowerCase('tr');
                const filtered = csvData.filter(item => {
                    const sy = String(item[colMap.sy] || '').toLocaleLowerCase('tr');
                    const sgs = String(item[colMap.sgs] || '').toLocaleLowerCase('tr');
                    return sy.includes(lowerSearch) || sgs.includes(lowerSearch); 
                });
                const grouped = {};
                filtered.forEach(item => {
                    const wh = item[colMap.warehouse] || 'Bilinmeyen Depo';
                    if (!grouped[wh]) grouped[wh] = { total: 0, orientation: { incomplete: [] }, chat: { incomplete: [] } };
                    grouped[wh].total += 1;
                    if (String(item[colMap.orientation]).toLowerCase() !== 'tamamladı') grouped[wh].orientation.incomplete.push(item);
                    if (String(item[colMap.chat]).toLowerCase() !== 'tamamladı') grouped[wh].chat.incomplete.push(item);
                });
                return grouped;
            }, [csvData, searchName, colMap]);

            const toggleWarehouse = (w) => setExpandedWarehouses(prev => ({...prev, [w]: !prev[w]}));
            
            const handleDownloadSingle = async (whName) => {
                if (!listRefs.current[whName]) return;
                const el = listRefs.current[whName];
                
                const originalWidth = el.style.width;
                const originalMinWidth = el.style.minWidth;
                el.style.width = "850px";
                el.style.minWidth = "850px";

                try {
                    const canvas = await html2canvas(el, { 
                        scale: 2, 
                        useCORS: true,
                        logging: false,
                        windowWidth: 1000
                    });
                    const link = document.createElement('a');
                    link.download = `${whName}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } catch(e) {
                    console.error("Canvas hatası:", e);
                } finally {
                    el.style.width = originalWidth;
                    el.style.minWidth = originalMinWidth;
                }
            };

            const handleDownloadAll = async () => {
                setDownloadingAll(true);
                const keys = Object.keys(processedData);
                for (const key of keys) {
                   await handleDownloadSingle(key);
                   await new Promise(r => setTimeout(r, 600));
                }
                setDownloadingAll(false);
            };

            const currentMonth = new Date().toLocaleString('tr-TR', { month: 'long' });
            const currentDate = new Date().toLocaleDateString('tr-TR');

            return (
                <div className="min-h-screen bg-slate-50 p-4 pb-24">
                    <div className="max-w-5xl mx-auto space-y-6">
                        
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                <FileText className="text-blue-600" />
                                Eğitim Takip Asistanı v25.3
                            </h1>
                        </div>

                        <div className="flex bg-white rounded-xl p-1 max-w-md mx-auto shadow-sm border">
                            <button onClick={() => setActiveTab('orientation')} className={`flex-1 py-2 text-sm font-medium rounded-lg transition-colors ${activeTab === 'orientation' ? 'bg-blue-100 text-blue-700' : 'text-slate-500'}`}>Oryantasyon</button>
                            <button onClick={() => setActiveTab('chat')} className={`flex-1 py-2 text-sm font-medium rounded-lg transition-colors ${activeTab === 'chat' ? 'bg-purple-100 text-purple-700' : 'text-slate-500'}`}>Öğretici Sohbetler</button>
                        </div>

                        {/* ID AYARLARI BUTONU */}
                        <div className="flex justify-end">
                            <div className="relative">
                                <button className="text-xs bg-white px-3 py-1.5 rounded border border-slate-200 text-slate-600 hover:bg-slate-50 font-medium flex items-center gap-1 shadow-sm transition-all">
                                    <FileUp size={12}/> Bilgi Dosyası Yükle (.txt)
                                </button>
                                <input type="file" accept=".txt" onChange={handleIdFile} className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" title="id.txt Yükle"/>
                            </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-4">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center relative min-h-[160px] hover:bg-slate-50 transition-colors cursor-pointer group">
                                <input type="file" onChange={handleFileUpload} disabled={loading} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                                {loading ? <Loader className="animate-spin text-blue-500 mb-2" size={32}/> : <Upload className="text-blue-500 mb-2 group-hover:scale-110 transition-transform" size={32}/>}
                                <span className="font-medium text-slate-700">{fileName || "Excel Dosyası Yükle"}</span>
                            </div>

                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-center">
                                <label className="text-sm font-medium text-slate-600 mb-2 flex items-center gap-2"><User size={16} /> Yönetici Seçiniz</label>
                                <div className="relative">
                                    <select value={searchName} onChange={e => setSearchName(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                                        <option value="">Seçiniz...</option>
                                        {managerList.map((m, i) => <option key={i} value={m}>{m}</option>)}
                                    </select>
                                    <Search className="absolute left-3 top-3.5 text-slate-400 w-5 h-5" />
                                </div>
                            </div>
                        </div>

                        {processedData && Object.entries(processedData).map(([whName, data]) => {
                            const currentData = activeTab === 'orientation' ? data.orientation : data.chat;
                            const isExpanded = expandedWarehouses[whName];

                            // Tamamlanma Oranı Hesaplama
                            const totalCount = data.total;
                            const incompleteCount = currentData.incomplete.length;
                            const completedCount = totalCount - incompleteCount;
                            const completionRate = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

                            // Oran Renkleri
                            let rateColor = "text-red-600";
                            if (completionRate > 20 && completionRate <= 50) rateColor = "text-orange-500";
                            else if (completionRate > 50 && completionRate <= 80) rateColor = "text-blue-600";
                            else if (completionRate > 80) rateColor = "text-green-600";

                            return (
                                <div key={whName} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div onClick={() => toggleWarehouse(whName)} className="p-4 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition-colors">
                                        <div className="flex items-center gap-3">
                                            <div className={`p-2 rounded-lg ${activeTab === 'orientation' ? 'bg-blue-50 text-blue-700' : 'bg-purple-50 text-purple-700'}`}><Filter size={18} /></div>
                                            <div>
                                                <h3 className="font-bold text-slate-800">{whName}</h3>
                                                <p className="text-xs text-slate-500">Eksik: <span className="font-bold text-red-600">{incompleteCount}</span> / Toplam: {totalCount}</p>
                                            </div>
                                        </div>
                                        
                                        <div className="flex items-center gap-4">
                                            <div className="text-right">
                                                <span className={`block text-lg font-bold ${rateColor}`}>%{completionRate}</span>
                                                <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Tamamlanma</span>
                                            </div>
                                            {isExpanded ? <ChevronUp /> : <ChevronDown />}
                                        </div>
                                    </div>

                                    {isExpanded && (
                                        <div className="border-t bg-slate-50/50 p-4">
                                            <div ref={el => listRefs.current[whName] = el} className="poster-output">
                                                <div className="poster-frame">
                                                    <header className="poster-header">
                                                        <div className="brand">
                                                            <div className="poster-logo font-getir">getir</div>
                                                            <div className="brandText">
                                                                <div className="poster-kicker">
                                                                    <span className="poster-kdot"></span> {whName} <span className="poster-kdot"></span> {activeTab === 'orientation' ? 'ORYANTASYON' : 'ÖĞRETİCİ SOHBETLER'}
                                                                </div>
                                                                <h1 className="poster-title uppercase">{activeTab === 'orientation' ? 'ORYANTASYON EĞİTİMİ' : 'ÖĞRETİCİ SOHBETLER EĞİTİMİ'}</h1>
                                                                <p className="poster-subtitle">
                                                                    {activeTab === 'chat' 
                                                                        ? `Bulunduğumuz ${currentMonth} ayı içeriği: “${chatSettings.name || 'Eğitim Adı'}” videosu yayında.`
                                                                        : `Oryantasyon eğitimi tamamlamayan kurye listesi güncellendi.`}
                                                                </p>
                                                            </div>
                                                        </div>
                                                        <div className="poster-date-pill">
                                                            <span className="poster-date-dot"></span>
                                                            <span className="poster-date-text">{currentDate}</span>
                                                        </div>
                                                    </header>

                                                    <main className="poster-main">
                                                        <section className="poster-card">
                                                            <div className="poster-card-head">
                                                                <h2 className="poster-card-title">Katılımcılar</h2>
                                                                <span className="poster-tag">{whName}</span>
                                                            </div>
                                                            <ul className="poster-list">
                                                                {currentData.incomplete.map((c, i) => (
                                                                    <li key={i}>{c[colMap.name]}</li>
                                                                ))}
                                                                {currentData.incomplete.length === 0 && <li className="text-green-600 font-bold">Harika! Herkes tamamladı 🎉</li>}
                                                            </ul>
                                                        </section>

                                                        <aside className="poster-card">
                                                            <div className="poster-info">
                                                                <h3>Video</h3>
                                                                <p>“{activeTab === 'orientation' ? 'Oryantasyon' : (chatSettings.name || 'Eğitim Adı')}” eğitim videosuna aşağıdaki bağlantıdan erişebilirsiniz.</p>
                                                                <div className="poster-pill-link">
                                                                    {activeTab === 'orientation' ? 'getirup.com/eep/activity/3740' : `getirup.com/eep/activity/${chatSettings.id || 'ID'}`}
                                                                </div>
                                                            </div>
                                                        </aside>
                                                    </main>

                                                    <footer className="poster-footer">
                                                        <section className="poster-glass-box">
                                                            <h4>Giriş Yöntemleri</h4>
                                                            <ul>
                                                                <li><strong>E.Mobil</strong> uygulaması telefonda yüklü olmalı.</li>
                                                                <li>MDU’ya giriş yapın → Profil bölümünden <strong>Getirup</strong>’ı seçin.</li>
                                                                <li>Şifresiz giriş kullanabilirsiniz.</li>
                                                            </ul>
                                                        </section>
                                                        <section className="poster-glass-box">
                                                            <h4>Alternatif Giriş</h4>
                                                            <ul>
                                                                <li>E.Mobil uygulamasına giriş yaparak erişebilirsiniz.</li>
                                                                <li>Kurum Kodu: <code>GETIRUP</code></li>
                                                                <li>Kullanıcı adı: Telefon numaranız (başında 0 olmadan)</li>
                                                                <li>“Parolamı unuttum” ile yeni parola oluşturabilirsiniz.</li>
                                                            </ul>
                                                        </section>
                                                    </footer>
                                                </div>
                                            </div>
                                            
                                            <div className="mt-4 flex justify-center gap-2">
                                                <button onClick={() => handleDownloadSingle(whName)} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold flex items-center gap-2 shadow-md hover:bg-blue-700 transition-all active:scale-95"><Download size={18}/> Görseli İndir</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}

                        <div className="fixed bottom-6 left-0 right-0 flex justify-center pointer-events-none">
                            <button onClick={handleDownloadAll} disabled={downloadingAll} className="bg-slate-800 text-white px-8 py-4 rounded-full font-bold shadow-lg pointer-events-auto flex items-center gap-2 hover:bg-slate-700 transition-all active:scale-95">
                                {downloadingAll ? <Loader className="animate-spin" size={20}/> : <Layers size={20}/>} Tüm Görselleri İndir
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
